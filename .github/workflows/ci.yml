name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Il2CppDumper-X.slnx
      - run: dotnet build Il2CppDumper-X.slnx --configuration Release --no-restore
      - run: dotnet test tests/Il2CppDumper.Tests/Il2CppDumper.Tests.csproj --configuration Release --no-build
      - run: dotnet publish src/Il2CppDumper.Cli/Il2CppDumper.Cli.csproj --configuration Release --runtime ${{ matrix.rid }} --output artifacts/cli
      - run: dotnet publish src/Il2CppDumper.Desktop/Il2CppDumper.Desktop.csproj --configuration Release --runtime ${{ matrix.rid }} --output artifacts/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: il2cppdumper-${{ matrix.rid }}
          path: artifacts
